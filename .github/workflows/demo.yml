name: Uji demo v45
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  inferensi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python src/v45/siapkan_model.py
      - run: python src/v45/uji_contoh.py --laporan hasil-uji.json
